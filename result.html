<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PeerCode Analysis Result</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f3f4f6; 
            color: #1f2937; 
            margin: 0; 
            padding: 40px; 
            display: flex; 
            justify-content: center; 
        }
        .container { 
            background: white; 
            max-width: 800px; 
            width: 100%; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        h1 { 
            font-size: 24px; 
            border-bottom: 2px solid #3b82f6; 
            padding-bottom: 10px; 
            margin-top: 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .badge { 
            font-size: 14px; 
            padding: 5px 10px; 
            border-radius: 5px; 
            color: white; 
            font-weight: bold; 
        }
        .cache { background-color: #f59e0b; }
        .live { background-color: #10b981; }
        pre { 
            background-color: #f8fafc; 
            padding: 20px; 
            border-radius: 8px; 
            border: 1px solid #e2e8f0; 
            white-space: pre-wrap; /* Yeh line text ko screen ke bahar jaane se rokegi */
            font-size: 15px; 
            line-height: 1.6; 
            overflow-x: auto; 
        }
        .copy-btn { 
            background-color: #3b82f6; 
            color: white; 
            border: none; 
            padding: 10px 15px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            float: right; 
            margin-top: 10px;
        }
        .copy-btn:hover { background-color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            🚀 PeerCode AI Analysis
            <span id="sourceBadge" class="badge">Loading...</span>
        </h1>
        <pre id="resultText">Fetching your analysis...</pre>
        <button class="copy-btn" id="copyBtn">Copy to Clipboard</button>
    </div>
    
    <script src="result.js"></script>
</body>
</html>
