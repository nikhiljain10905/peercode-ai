<!DOCTYPE html>
<html>
<head>
    <title>PeerCode AI</title>
    <style>
        body {
            width: 320px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            background-color: #f9fafb;
            color: #333;
        }
        h2 {
            font-size: 18px;
            color: #1f2937;
            margin-bottom: 5px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 5px;
        }
        p {
            font-size: 13px;
            color: #4b5563;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            margin-bottom: 5px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .small-label {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 10px;
            display: block;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <h2>PeerCode AI</h2>
    <p>Compare your CF submissions against your peers.</p>
    
    <input type="text" id="cfHandle" placeholder="Your CF Handle (e.g., tourist)">
    
    <input type="text" id="friendsHandles" placeholder="Friend1, Friend2, ... (Max 5)">
    <span class="small-label">Enter up to 5 friends (comma separated)</span>
    
    
    <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 5px;">
        <input type="checkbox" id="forceLive" style="width: auto; margin: 0;">
        <label for="forceLive" style="font-size: 12px; color: #4b5563; cursor: pointer;">Force Live AI (Ignore Cache)</label>
    </div>
    
    <button id="analyzeBtn">Analyze Code</button>
    
    <script src="popup.js"></script>
</body>
</html>
