<!DOCTYPE html>
<html>
<head>
    <title>PeerCode AI</title>
    <style>
        body {
            width: 320px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 15px;
            background-color: #f9fafb;
            color: #333;
        }
        h2 {
            font-size: 18px;
            color: #1f2937;
            margin-bottom: 5px;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 5px;
        }
        p {
            font-size: 13px;
            color: #4b5563;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            box-sizing: border-box; 
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>
    <h2>🚀 PeerCode AI</h2>
    <p>Analyze complexity and cleanliness of your Codeforces submissions against your peers.</p>
    
    <input type="text" id="cfHandle" placeholder="Enter your CF Handle (e.g., tourist)">
    
    <button id="analyzeBtn">Analyze Code</button>
    
    <script src="popup.js"></script>
</body>
</html>
